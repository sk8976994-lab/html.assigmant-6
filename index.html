<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form>


        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="text" id="phone" name="phone" placeholder="03XX-XXXXXXX" required>
            <br><br>

            <label for="website">Website / Portfolio:</label><br>
            <input type="url" id="website" name="website" placeholder="https://yourportfolio.com" required>
            <br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required>
        </fieldset>

        <br>

        <fieldset>
            <legend>Job Details</legend>

            <label for="position">Job Position:</label><br>
            <select id="position" name="position" required>
                <option value="">-- Select Position --</option>
                <option>Frontend Developer</option>
                <option>Backend Developer</option>
                <option>UI/UX Designer</option>
                <option>QA Engineer</option>
            </select>
            <br><br>

 
            <p>Preferred Work Location:</p>
            <label>
                <input type="radio" name="location" value="On-site" required> On-site
            </label>
            <label>
                <input type="radio" name="location" value="Remote"> Remote
            </label>
            <label>
                <input type="radio" name="location" value="Hybrid"> Hybrid
            </label>
            <br><br>

            <p>Skills:</p>
            <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
            <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
            <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
            <label><input type="checkbox" name="skills" value="React"> React</label>
            <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
            <br><br>

            <label for="resume">Upload Resume:</label><br>
            <input type="file" id="resume" name="resume" required>
            <br><br>

            <label for="about">Write About Yourself:</label><br>
            <textarea id="about" name="about" rows="5" cols="40" placeholder="Tell us about yourself..." required></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend>Extra Section</legend>

            <label for="search">Search your favorite tech stack:</label><br>
            <input type="search" id="search" name="search" placeholder="e.g., MERN Stack">
            <br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            <br><br>

            <label for="confirm">Confirm Password:</label><br>
            <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required>
        </fieldset>

        <br>


        <input type="submit" value="Submit Application">



    </form>

</body>
</html>
